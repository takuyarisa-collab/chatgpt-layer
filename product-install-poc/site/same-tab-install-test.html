<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ChatGPT Layer 同一タブ導入テスト</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #100d16; color: #f6f1fb; }
    main { width: min(100%, 520px); padding: 24px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: #1f192b; }
    h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.1; }
    p { color: #c9c1d3; line-height: 1.65; }
    button { width: 100%; min-height: 58px; margin-top: 16px; border: 0; border-radius: 17px; background: linear-gradient(135deg,#a48aff,#7f5cff); color: white; font: inherit; font-weight: 800; font-size: 17px; }
    small { display: block; margin-top: 14px; color: #8f879a; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>同じタブで導入できるか確認</h1>
    <p>通常リンクではGearがコード用の新規タブを作りました。このテストはJavaScriptの <code>location.assign()</code> で現在のタブを直接UserScriptへ移動します。</p>
    <button id="install" type="button">同じタブでインストール</button>
    <small>確認点：新しいタブが増えるか／インストール後にどの画面へ戻るか。</small>
  </main>
  <script>
    const installerUrl = "https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/install-test.user.js";
    document.getElementById("install").addEventListener("click", () => {
      window.location.assign(installerUrl);
    });
  </script>
</body>
</html>

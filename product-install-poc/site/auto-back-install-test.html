<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ChatGPT Layer 自動バック導入テスト</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #100d16; color: #f6f1fb; }
    main { width: min(100%, 520px); padding: 24px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: #1f192b; }
    h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.1; }
    p { color: #c9c1d3; line-height: 1.65; }
    button, a { width: 100%; min-height: 58px; margin-top: 16px; border: 0; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#a48aff,#7f5cff); color: white; font: inherit; font-weight: 800; font-size: 17px; text-decoration: none; }
    .status { display: none; margin-top: 18px; padding: 14px; border-radius: 14px; background: rgba(77, 205, 134, .12); color: #bff5d3; }
    .status.visible { display: block; }
    small { display: block; margin-top: 14px; color: #8f879a; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>インストール完了後に自動で戻れるか</h1>
    <p>同じタブでUserScriptを開きます。Gearでインストールを完了したあと、新しく入ったUserScriptがコード画面上で動けば、このページへ自動で戻ります。</p>
    <button id="install" type="button">自動バックをテスト</button>
    <div class="status" id="status">自動でこのページへ戻りました。</div>
    <a href="https://chatgpt.com/" id="open-chatgpt" hidden>ChatGPTを開く</a>
    <small>自動で戻らない場合は、Gearがインストール直後のコード画面へ新しいUserScriptを即時反映していないため、この方式は使えません。</small>
  </main>
  <script>
    const installerUrl = "https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/auto-back-test.user.js?autoback=1";
    const installButton = document.getElementById("install");
    const status = document.getElementById("status");
    const openChatGpt = document.getElementById("open-chatgpt");

    installButton.addEventListener("click", () => {
      sessionStorage.setItem("cglp-auto-back-started", "1");
      window.location.assign(installerUrl);
    });

    function showReturnedState() {
      if (sessionStorage.getItem("cglp-auto-back-started") !== "1") return;
      status.classList.add("visible");
      openChatGpt.hidden = false;
      installButton.textContent = "もう一度テスト";
    }

    window.addEventListener("pageshow", showReturnedState);
    showReturnedState();
  </script>
</body>
</html>

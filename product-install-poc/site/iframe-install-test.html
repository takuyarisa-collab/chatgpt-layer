<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#17131f">
  <title>ChatGPT Layer インストール導線テスト v2</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #100d16;
      color: #f6f1fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at 80% 0%, rgba(145, 106, 255, .18), transparent 38%),
        linear-gradient(180deg, #17131f 0%, #100d16 100%);
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 20px max(34px, env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 44px;
    }
    .brand { font-weight: 800; letter-spacing: -.02em; }
    .language {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }
    .language button {
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      color: #bdb5ca;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
    }
    .language button[aria-pressed="true"] {
      color: #fff;
      background: rgba(157,126,255,.28);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #b9a7ff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 15ch;
      font-size: clamp(36px, 10vw, 58px);
      line-height: 1;
      letter-spacing: -.05em;
    }
    .lead {
      margin: 20px 0 0;
      color: #c9c1d3;
      font-size: 17px;
      line-height: 1.6;
    }
    .card {
      margin-top: 32px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 24px;
      background: rgba(31,25,43,.8);
      box-shadow: 0 22px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .primary, .secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      border-radius: 17px;
      padding: 14px 18px;
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .primary {
      border: 0;
      background: linear-gradient(135deg, #a48aff, #7f5cff);
      box-shadow: 0 13px 28px rgba(100,70,220,.32), inset 0 1px 0 rgba(255,255,255,.34);
    }
    .secondary {
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
    }
    .status {
      min-height: 48px;
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: #cfc6d8;
      font-size: 14px;
      line-height: 1.55;
    }
    .fallback {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .fallback.visible { display: block; }
    .fallback p {
      margin: 0 0 10px;
      color: #aaa1b5;
      font-size: 13px;
      line-height: 1.55;
    }
    footer {
      margin-top: 24px;
      color: #847d8d;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }
    #installer-frame {
      position: fixed;
      left: -10px;
      bottom: -10px;
      width: 1px;
      height: 1px;
      border: 0;
      opacity: .001;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">ChatGPT Layer</div>
      <div class="language" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="false">EN</button>
        <button type="button" data-language="ja" aria-pressed="true">日本語</button>
      </div>
    </header>

    <p class="eyebrow" data-copy="eyebrow">INSTALL FLOW TEST V2</p>
    <h1 data-copy="title">コード画面を開かずに導入できるか。</h1>
    <p class="lead" data-copy="lead">このテストでは、UserScriptを新規タブではなくページ内の非表示フレームから読み込みます。</p>

    <section class="card">
      <button class="primary" id="install-button" type="button" data-copy="install">コード画面なしでインストール</button>
      <div class="status" id="status" data-copy="idle">ボタンを押すと、Gearのインストール画面が表示されるか確認します。</div>

      <div class="fallback" id="fallback">
        <p data-copy="fallbackText">数秒待ってもインストール画面が出ない場合、この方式はGearでは使えません。</p>
        <a class="secondary" href="https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/install-test.user.js" data-copy="normalInstall">通常方式でインストール</a>
      </div>

      <a class="secondary" href="https://chatgpt.com/" data-copy="openChatGPT">ChatGPTを開く</a>
    </section>

    <footer data-copy="privacy">アクセス解析なし。このテストは導入画面の呼び出し方だけを確認します。</footer>
  </main>

  <iframe id="installer-frame" title="UserScript installer"></iframe>

  <script>
    const INSTALL_URL = "https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/install-test.user.js";
    const copy = {
      ja: {
        eyebrow: "INSTALL FLOW TEST V2",
        title: "コード画面を開かずに導入できるか。",
        lead: "このテストでは、UserScriptを新規タブではなくページ内の非表示フレームから読み込みます。",
        install: "コード画面なしでインストール",
        idle: "ボタンを押すと、Gearのインストール画面が表示されるか確認します。",
        waiting: "Gearのインストール画面を待っています…",
        fallbackText: "数秒待ってもインストール画面が出ない場合、この方式はGearでは使えません。",
        normalInstall: "通常方式でインストール",
        openChatGPT: "ChatGPTを開く",
        privacy: "アクセス解析なし。このテストは導入画面の呼び出し方だけを確認します。"
      },
      en: {
        eyebrow: "INSTALL FLOW TEST V2",
        title: "Can Gear install without showing source code?",
        lead: "This test loads the UserScript in a hidden frame instead of opening a new tab.",
        install: "Install without source-code tab",
        idle: "Tap the button and check whether Gear shows its UserScript install screen.",
        waiting: "Waiting for Gear's install screen…",
        fallbackText: "If no install screen appears after a few seconds, Gear does not support this method.",
        normalInstall: "Use normal installer",
        openChatGPT: "Open ChatGPT",
        privacy: "No analytics. This test only validates the installation handoff."
      }
    };

    const buttons = [...document.querySelectorAll("[data-language]")];
    const nodes = [...document.querySelectorAll("[data-copy]")];
    const frame = document.getElementById("installer-frame");
    const installButton = document.getElementById("install-button");
    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");
    let language = (navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en";

    function render() {
      document.documentElement.lang = language;
      for (const node of nodes) {
        const value = copy[language][node.dataset.copy];
        if (value) node.textContent = value;
      }
      for (const button of buttons) {
        button.setAttribute("aria-pressed", String(button.dataset.language === language));
      }
      document.title = language === "ja"
        ? "ChatGPT Layer 導入テスト v2"
        : "ChatGPT Layer Install Test v2";
    }

    for (const button of buttons) {
      button.addEventListener("click", () => {
        language = button.dataset.language;
        render();
      });
    }

    installButton.addEventListener("click", () => {
      status.textContent = copy[language].waiting;
      fallback.classList.remove("visible");
      frame.src = `${INSTALL_URL}?iframe-test=${Date.now()}`;
      window.setTimeout(() => fallback.classList.add("visible"), 4500);
    });

    render();
  </script>
</body>
</html>

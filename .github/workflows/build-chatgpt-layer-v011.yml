name: Build ChatGPT Layer v0.11.0

on:
  push:
    branches:
      - agent/desk-surface-v011
    paths:
      - "build/desk-surface-v011/**"
      - ".github/workflows/build-chatgpt-layer-v011.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desk-surface-v011
          fetch-depth: 0

      - name: Assemble userscript
        shell: bash
        run: |
          cat build/desk-surface-v011/part*.txt > chatgpt-layer.user.js
          node --check chatgpt-layer.user.js
          grep -q "@version      0.11.0" chatgpt-layer.user.js
          grep -q "data-chatgpt-layer-desk-surface" chatgpt-layer.user.js
          grep -q "data-chatgpt-layer-desk-mat" chatgpt-layer.user.js

      - name: Commit generated userscript
        shell: bash
        run: |
          if git diff --quiet -- chatgpt-layer.user.js; then
            echo "No generated change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-layer.user.js
          git commit -m "Build ChatGPT Layer v0.11.0"
          git push origin HEAD:agent/desk-surface-v011

name: Publish Room Layer 0.3.76

on:
  push:
    branches:
      - release-publish-0.3.76

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: room-layer-distribution
          fetch-depth: 0

      - name: Download signed candidate
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-6210-8206-9d97-ac39a5924abe/raw?se=2026-09-25T03%3A41%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=584666c6-4638-593b-9487-ead32a864b19&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T23%3A34%3A50Z&ske=2026-09-25T23%3A34%3A50Z&sks=b&skv=2026-02-06&sig=7OqJEm5NN20XeI3ZJ/0k1gjMAszaQ1xmyjZfIcndW6g%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o "$RUNNER_TEMP/release.zip"
          unzip -q "$RUNNER_TEMP/release.zip" -d "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/room-layer-0.3.76.crx"

      - name: Verify signed candidate identity
        run: |
          set -euo pipefail
          crx="$RUNNER_TEMP/release/room-layer-0.3.76.crx"
          expected_sha="7cbc52b870cb494a9b34b47f31de816cb7469875199209cb29941d0189eda946"
          expected_size="85389"
          actual_sha="$(sha256sum "$crx" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$crx")"
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"

      - name: Publish immutable payload
        run: |
          set -euo pipefail
          crx="$RUNNER_TEMP/release/room-layer-0.3.76.crx"
          target="room-layer-distribution/base64/0.3.76-v1"
          test ! -e "$target"
          mkdir -p "$target"
          CRX_PATH="$crx" TARGET="$target" python - <<'PY'
          import base64, os
          from pathlib import Path

          crx = Path(os.environ["CRX_PATH"]).read_bytes()
          encoded = base64.b64encode(crx).decode("ascii")
          target = Path(os.environ["TARGET"])
          chunks = [encoded[i:i + 4000] for i in range(0, len(encoded), 4000)]
          if len(chunks) > 32:
              raise SystemExit(f"too many chunks: {len(chunks)}")
          for index, chunk in enumerate(chunks):
              (target / f"part-{index:02d}.txt").write_text(chunk, encoding="ascii")
          print(f"published {len(chunks)} chunks")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Publish Room Layer 0.3.76 beta payload"
          git push origin room-layer-distribution
          echo "PAYLOAD_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Point stable channel at 0.3.76
        run: |
          set -euo pipefail
          PAYLOAD_REF="$PAYLOAD_REF" python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("room-layer-distribution/channel.json")
          parts = [f"base64/0.3.76-v1/part-{i:02d}.txt" for i in range(29)]
          channel = {
              "kind": "room-layer-gear-crx-channel-v1",
              "version": "0.3.76",
              "versionName": "0.3.76-beta",
              "extensionId": "fiphbncifdnofmjpinaohfidalhcbcnj",
              "payloadRef": os.environ["PAYLOAD_REF"],
              "sha256": "7cbc52b870cb494a9b34b47f31de816cb7469875199209cb29941d0189eda946",
              "size": 85389,
              "encoding": "base64-chunks",
              "parts": parts,
          }
          path.write_text(json.dumps(channel, indent=2) + "\n", encoding="utf-8")
          PY
          git add room-layer-distribution/channel.json
          git commit -m "Point Room Layer channel at 0.3.76 beta payload"
          git push origin room-layer-distribution

      - name: Verify stable CRX before advertising update
        run: |
          set -euo pipefail
          url="https://room-layer-distribution-proof.vercel.app/downloads/room-layer.crx"
          expected_sha="7cbc52b870cb494a9b34b47f31de816cb7469875199209cb29941d0189eda946"
          expected_size="85389"
          ok=0
          for attempt in $(seq 1 18); do
            rm -f "$RUNNER_TEMP/stable.crx" "$RUNNER_TEMP/headers.txt"
            if curl --fail --silent --show-error -D "$RUNNER_TEMP/headers.txt" "$url?verify=$attempt-$(date +%s)" -o "$RUNNER_TEMP/stable.crx"; then
              actual_sha="$(sha256sum "$RUNNER_TEMP/stable.crx" | awk '{print $1}')"
              actual_size="$(stat -c '%s' "$RUNNER_TEMP/stable.crx")"
              version="$(awk 'BEGIN{IGNORECASE=1} /^x-room-layer-version:/ {gsub("\r",""); print $2}' "$RUNNER_TEMP/headers.txt")"
              ext_id="$(awk 'BEGIN{IGNORECASE=1} /^x-room-layer-extension-id:/ {gsub("\r",""); print $2}' "$RUNNER_TEMP/headers.txt")"
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); $1=""; sub(/^ /,""); print}' "$RUNNER_TEMP/headers.txt")"
              if [[ "$actual_sha" == "$expected_sha" && "$actual_size" == "$expected_size" && "$version" == "0.3.76" && "$ext_id" == "fiphbncifdnofmjpinaohfidalhcbcnj" && "$ctype" == application/x-chrome-extension* ]]; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Advertise 0.3.76 only after stable verification
        run: |
          set -euo pipefail
          cat > room-layer-distribution/update.meta.js <<'EOF'
          // ==UserScript==
          // @name Room Layer
          // @version 0.3.76-beta
          // ==/UserScript==
          EOF
          git add room-layer-distribution/update.meta.js
          git commit -m "Advertise Room Layer 0.3.76 beta update"
          git push origin room-layer-distribution

      - name: Verify production update metadata
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/room-layer-distribution/room-layer-distribution/update.meta.js"
          relay="https://room-layer-telemetry.vercel.app/api/update-meta"
          ok=0
          for attempt in $(seq 1 18); do
            raw_text="$(curl --fail --silent --show-error "$raw?verify=$attempt-$(date +%s)" || true)"
            relay_text="$(curl --fail --silent --show-error "$relay?verify=$attempt-$(date +%s)" || true)"
            if grep -q "@version 0.3.76-beta" <<<"$raw_text" && grep -q "@version 0.3.76-beta" <<<"$relay_text"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

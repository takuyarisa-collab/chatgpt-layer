name: Publish Room Layer dev11.1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/dev11-1-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FROM_VERSION: "0.3.0-dev11"
      VERSION: "0.3.0-dev11.1"
      OLD_USER_SHA256: "ec726f458126f5a8e130dd8482ba5ffb09e3bd0d900a4c554f4c86b1756ab3c2"
      OLD_META_SHA256: "a7c5230162d9b8784dda58b8cb69f4425a99ef878c980048c7162ebb4f1e5394"
      USER_SHA256: "7db472f2f67d71b44487a02d7fe0093e853f3659b7987873b9b7171802cede03"
      META_SHA256: "f9249d2df9e8be169670b2be1cffb02f020fb191b505445b6b4343b38700144c"
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: product-install-poc
          fetch-depth: 0

      - name: Verify current dev11 baseline
        run: |
          echo "$OLD_USER_SHA256  product-install-poc/channels/dev/room-layer-dev.user.js" | sha256sum --check --strict
          echo "$OLD_META_SHA256  product-install-poc/channels/dev/room-layer-dev.meta.js" | sha256sum --check --strict

      - name: Reconstruct exact CI dev11.1 artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          user_path = Path("product-install-poc/channels/dev/room-layer-dev.user.js")
          meta_path = Path("product-install-poc/channels/dev/room-layer-dev.meta.js")
          text = user_path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once("// @version      0.3.0-dev11", "// @version      0.3.0-dev11.1")
          replace_once(
              '    const DEVELOPMENT_VERSION = "0.3.0-dev11";',
              '    const DEVELOPMENT_VERSION = "0.3.0-dev11.1";'
          )
          replace_once(
              "      let updateState = createIdleUpdateState();\n",
              "      let updateState = createIdleUpdateState();\n      let storageSyncGeneration = 0;\n"
          )
          replace_once(
              '''      const stopNavigationWatcher = watchNavigation((nextContext) => {\n        context = nextContext;\n        const availableScopes = getAvailableAssignmentScopes(context);\n        if (!availableScopes.includes(selectedScope)) {\n          selectedScope = getPreferredScope(context);\n        }\n        refreshEditorTheme();\n        applyCurrentTheme();\n        renderPanel();\n      });\n    \n      globalThis.addEventListener("pagehide", (event) => {''',
              '''      const stopNavigationWatcher = watchNavigation((nextContext) => {\n        context = nextContext;\n        const availableScopes = getAvailableAssignmentScopes(context);\n        if (!availableScopes.includes(selectedScope)) {\n          selectedScope = getPreferredScope(context);\n        }\n        refreshEditorTheme();\n        applyCurrentTheme();\n        renderPanel();\n      });\n    \n      const handleVisibilityChange = () => {\n        if (document.visibilityState !== "visible") return;\n        void syncFromStorage();\n      };\n      document.addEventListener("visibilitychange", handleVisibilityChange);\n    \n      globalThis.addEventListener("pagehide", (event) => {'''
          )
          replace_once(
              '''        stopNavigationWatcher();\n        pageBackground.clear();''',
              '''        stopNavigationWatcher();\n        document.removeEventListener("visibilitychange", handleVisibilityChange);\n        pageBackground.clear();'''
          )
          replace_once(
              '''      async function refreshUpdateState({ force = false } = {}) {''',
              '''      async function syncFromStorage() {\n        const syncGeneration = ++storageSyncGeneration;\n        const nextContext = parseChatGptContext(globalThis.location);\n        if (!nextContext.supported) return;\n    \n        const nextLoadResult = await store.load();\n        if (\n          syncGeneration !== storageSyncGeneration ||\n          !runtimeGuard.isCurrent() ||\n          document.visibilityState === "hidden"\n        ) {\n          return;\n        }\n    \n        context = nextContext;\n        settings = nextLoadResult.settings;\n        translator = createProductTranslator(settings.language);\n        const availableScopes = getAvailableAssignmentScopes(context);\n        if (!availableScopes.includes(selectedScope)) {\n          selectedScope = getPreferredScope(context);\n        }\n        refreshEditorTheme();\n        applyCurrentTheme();\n        renderPanel();\n    \n        if (nextLoadResult.recovered) {\n          panel.setStatus(translator.t("status.recovered"));\n        }\n      }\n    \n      async function refreshUpdateState({ force = false } = {}) {'''
          )
          replace_once(
              '''      }) {\n        const draft = clone(settings);''',
              '''      }) {\n        storageSyncGeneration += 1;\n        const latestLoadResult = await store.load();\n        if (!runtimeGuard.isCurrent()) return;\n    \n        const draft = clone(latestLoadResult.settings);'''
          )
          replace_once(
              '''      async function importFromPanel(jsonText) {''',
              '''      async function importFromPanel(jsonText) {\n        storageSyncGeneration += 1;'''
          )
          replace_once(
              '''      async function resetFromPanel() {''',
              '''      async function resetFromPanel() {\n        storageSyncGeneration += 1;'''
          )

          user_path.write_text(text, encoding="utf-8", newline="")

          meta = meta_path.read_text(encoding="utf-8")
          if meta.count("// @version      0.3.0-dev11") != 1:
              raise SystemExit("unexpected dev11 metadata baseline")
          meta = meta.replace(
              "// @version      0.3.0-dev11",
              "// @version      0.3.0-dev11.1",
              1
          )
          meta_path.write_text(meta, encoding="utf-8", newline="")
          PY

          echo "$USER_SHA256  product-install-poc/channels/dev/room-layer-dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  product-install-poc/channels/dev/room-layer-dev.meta.js" | sha256sum --check --strict

      - name: Verify identity and publish immutable file
        run: |
          grep -F "// @version      $VERSION" product-install-poc/channels/dev/room-layer-dev.user.js
          grep -F "// @name         Room Layer Dev" product-install-poc/channels/dev/room-layer-dev.user.js
          grep -F "// @namespace    https://github.com/takuyarisa-collab/chatgpt-layer-product" product-install-poc/channels/dev/room-layer-dev.user.js
          grep -F "// @updateURL    https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.meta.js" product-install-poc/channels/dev/room-layer-dev.user.js
          grep -F "// @downloadURL  https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.user.js" product-install-poc/channels/dev/room-layer-dev.user.js
          if grep -q '^// @require' product-install-poc/channels/dev/room-layer-dev.user.js; then
            echo "Unexpected @require in standalone artifact" >&2
            exit 1
          fi

          mkdir -p "product-install-poc/releases/$VERSION"
          cp product-install-poc/channels/dev/room-layer-dev.user.js \
            "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js"
          echo "$USER_SHA256  product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" | sha256sum --check --strict

      - name: Commit published dev11.1 channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" \
            product-install-poc/channels/dev/room-layer-dev.user.js \
            product-install-poc/channels/dev/room-layer-dev.meta.js
          if git diff --cached --quiet; then
            echo "dev11.1 is already published"
            exit 0
          fi
          git commit -m "Publish Room Layer dev11.1"
          git push origin HEAD:product-install-poc

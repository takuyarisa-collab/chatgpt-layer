name: Publish Room Layer dev11 from main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-room-layer-dev11-from-main.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/dev11-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b550-8206-bb10-a29153aaeeb5/raw?se=2026-08-07T10%3A04%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=df69bca4-a606-58c1-8623-a6e81b8e7c46&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T01%3A03%3A48Z&ske=2026-08-08T01%3A03%3A48Z&sks=b&skv=2026-02-06&sig=WnMxMld7admswYAzW7aVeMj1wg1M47oQRYfJqQkBrnk%3D"
      ZIP_SHA256: "75bc0f767f4db1c83d886a2850ecc9aa0d54b94995038b3f0a2f22b5f11993fa"
      USER_SHA256: "ec726f458126f5a8e130dd8482ba5ffb09e3bd0d900a4c554f4c86b1756ab3c2"
      META_SHA256: "a7c5230162d9b8784dda58b8cb69f4425a99ef878c980048c7162ebb4f1e5394"
      VERSION: "0.3.0-dev11"
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: product-install-poc
          fetch-depth: 0

      - name: Download CI-verified artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/room-layer-dev.zip
          echo "$ZIP_SHA256  /tmp/room-layer-dev.zip" | sha256sum --check --strict

      - name: Verify artifact contents
        run: |
          rm -rf /tmp/room-layer-dev
          mkdir -p /tmp/room-layer-dev
          unzip -q /tmp/room-layer-dev.zip -d /tmp/room-layer-dev
          echo "$USER_SHA256  /tmp/room-layer-dev/room-layer.dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  /tmp/room-layer-dev/room-layer.dev.meta.js" | sha256sum --check --strict
          grep -F "// @version      $VERSION" /tmp/room-layer-dev/room-layer.dev.user.js
          grep -F "// @version      $VERSION" /tmp/room-layer-dev/room-layer.dev.meta.js
          grep -F "// @name         Room Layer Dev" /tmp/room-layer-dev/room-layer.dev.user.js
          grep -F "// @namespace    https://github.com/takuyarisa-collab/chatgpt-layer-product" /tmp/room-layer-dev/room-layer.dev.user.js
          grep -F "// @updateURL    https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.meta.js" /tmp/room-layer-dev/room-layer.dev.user.js
          grep -F "// @downloadURL  https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.user.js" /tmp/room-layer-dev/room-layer.dev.user.js
          if grep -q '^// @require' /tmp/room-layer-dev/room-layer.dev.user.js; then
            echo "Unexpected @require in standalone artifact" >&2
            exit 1
          fi

      - name: Publish immutable and fixed development files
        run: |
          mkdir -p "product-install-poc/releases/$VERSION"
          mkdir -p product-install-poc/channels/dev
          cp /tmp/room-layer-dev/room-layer.dev.user.js "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js"
          cp /tmp/room-layer-dev/room-layer.dev.user.js product-install-poc/channels/dev/room-layer-dev.user.js
          cp /tmp/room-layer-dev/room-layer.dev.meta.js product-install-poc/channels/dev/room-layer-dev.meta.js
          echo "$USER_SHA256  product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" | sha256sum --check --strict
          echo "$USER_SHA256  product-install-poc/channels/dev/room-layer-dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  product-install-poc/channels/dev/room-layer-dev.meta.js" | sha256sum --check --strict

      - name: Commit published dev11 channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" \
            product-install-poc/channels/dev/room-layer-dev.user.js \
            product-install-poc/channels/dev/room-layer-dev.meta.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "dev11 is already published"
            exit 0
          fi
          git commit -m "Publish Room Layer dev11"
          git push origin HEAD:product-install-poc

name: Publish Room Layer dev11 from main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/dev11-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FROM_VERSION: "0.3.0-dev10"
      VERSION: "0.3.0-dev11"
      USER_SHA256: "ec726f458126f5a8e130dd8482ba5ffb09e3bd0d900a4c554f4c86b1756ab3c2"
      META_SHA256: "a7c5230162d9b8784dda58b8cb69f4425a99ef878c980048c7162ebb4f1e5394"
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: product-install-poc
          fetch-depth: 0

      - name: Reconstruct exact CI dev11 artifact from published dev10
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          old = os.environ["FROM_VERSION"]
          new = os.environ["VERSION"]
          source_user = Path("product-install-poc/channels/dev/room-layer-dev.user.js")
          source_meta = Path("product-install-poc/channels/dev/room-layer-dev.meta.js")
          out = Path("/tmp/room-layer-dev11")
          out.mkdir(parents=True, exist_ok=True)

          for source, target_name in [
              (source_user, "room-layer.dev.user.js"),
              (source_meta, "room-layer.dev.meta.js"),
          ]:
              text = source.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{old} not found in {source}")
              text = text.replace(old, new)
              (out / target_name).write_text(text, encoding="utf-8", newline="")
          PY

          echo "$USER_SHA256  /tmp/room-layer-dev11/room-layer.dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  /tmp/room-layer-dev11/room-layer.dev.meta.js" | sha256sum --check --strict

      - name: Verify identity and standalone constraints
        run: |
          grep -F "// @version      $VERSION" /tmp/room-layer-dev11/room-layer.dev.user.js
          grep -F "// @version      $VERSION" /tmp/room-layer-dev11/room-layer.dev.meta.js
          grep -F "// @name         Room Layer Dev" /tmp/room-layer-dev11/room-layer.dev.user.js
          grep -F "// @namespace    https://github.com/takuyarisa-collab/chatgpt-layer-product" /tmp/room-layer-dev11/room-layer.dev.user.js
          grep -F "// @updateURL    https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.meta.js" /tmp/room-layer-dev11/room-layer.dev.user.js
          grep -F "// @downloadURL  https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.user.js" /tmp/room-layer-dev11/room-layer.dev.user.js
          if grep -q '^// @require' /tmp/room-layer-dev11/room-layer.dev.user.js; then
            echo "Unexpected @require in standalone artifact" >&2
            exit 1
          fi

      - name: Publish immutable and fixed development files
        run: |
          mkdir -p "product-install-poc/releases/$VERSION"
          mkdir -p product-install-poc/channels/dev
          cp /tmp/room-layer-dev11/room-layer.dev.user.js "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js"
          cp /tmp/room-layer-dev11/room-layer.dev.user.js product-install-poc/channels/dev/room-layer-dev.user.js
          cp /tmp/room-layer-dev11/room-layer.dev.meta.js product-install-poc/channels/dev/room-layer-dev.meta.js
          echo "$USER_SHA256  product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" | sha256sum --check --strict
          echo "$USER_SHA256  product-install-poc/channels/dev/room-layer-dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  product-install-poc/channels/dev/room-layer-dev.meta.js" | sha256sum --check --strict

      - name: Commit published dev11 channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "product-install-poc/releases/$VERSION/room-layer-$VERSION.user.js" \
            product-install-poc/channels/dev/room-layer-dev.user.js \
            product-install-poc/channels/dev/room-layer-dev.meta.js
          if git diff --cached --quiet; then
            echo "dev11 is already published"
            exit 0
          fi
          git commit -m "Publish Room Layer dev11"
          git push origin HEAD:product-install-poc

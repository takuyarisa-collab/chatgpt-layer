name: Publish Room Layer development channel

on:
  push:
    branches:
      - product-install-poc
    paths:
      - .github/workflows/rebuild-product-install-poc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-3f50-8207-b7b9-d56b8e350a60/raw?se=2026-08-07T01%3A00%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=57130a4a-9250-539a-98ed-68f96b5f7bfc&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A26%3A58Z&ske=2026-08-07T05%3A26%3A58Z&sks=b&skv=2026-02-06&sig=R1TYpZBSCdQKAmSyIuLNcNarnUkN0wykUAkvwP7G8Sg%3D"
      USER_SHA256: "8121ee5597943f3a9ac43435102811e091d0d4fb0dce14c8d386d5d676cc5f8f"
      META_SHA256: "d660bdf4012fe4dc2e23605c2f2a4c44b9b34ec767dfbaa19f5caa1af177d2f4"
      VERSION: "0.3.0-dev9"
      VERSION_DIR: "product-install-poc/releases/0.3.0-dev9"
      CHANNEL_DIR: "product-install-poc/channels/dev"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-install-poc
      - name: Download verified CI artifacts
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/room-layer.zip
          rm -rf /tmp/room-layer-artifact
          mkdir -p /tmp/room-layer-artifact "$VERSION_DIR" "$CHANNEL_DIR"
          unzip -o /tmp/room-layer.zip -d /tmp/room-layer-artifact
      - name: Verify exact development artifacts
        run: |
          set -euo pipefail
          echo "$USER_SHA256  /tmp/room-layer-artifact/room-layer.dev.user.js" | sha256sum --check --strict
          echo "$META_SHA256  /tmp/room-layer-artifact/room-layer.dev.meta.js" | sha256sum --check --strict
          node --check /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @name         Room Layer Dev' /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq "// @version      $VERSION" /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @updateURL    https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.meta.js' /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @downloadURL  https://raw.githubusercontent.com/takuyarisa-collab/chatgpt-layer/product-install-poc/product-install-poc/channels/dev/room-layer-dev.user.js' /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @connect      raw.githubusercontent.com' /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @grant        GM_xmlhttpRequest' /tmp/room-layer-artifact/room-layer.dev.user.js
          grep -Fq '// @grant        GM.xmlHttpRequest' /tmp/room-layer-artifact/room-layer.dev.user.js
          if grep -Fq '@require' /tmp/room-layer-artifact/room-layer.dev.user.js; then
            echo 'Unexpected runtime dependency in standalone userscript.' >&2
            exit 1
          fi
      - name: Publish versioned and fixed channel files
        run: |
          set -euo pipefail
          cp /tmp/room-layer-artifact/room-layer.dev.user.js "$VERSION_DIR/room-layer-$VERSION.user.js"
          cp /tmp/room-layer-artifact/room-layer.dev.meta.js "$VERSION_DIR/room-layer-$VERSION.meta.js"
          cp /tmp/room-layer-artifact/room-layer.dev.user.js "$CHANNEL_DIR/room-layer-dev.user.js"
          cp /tmp/room-layer-artifact/room-layer.dev.meta.js "$CHANNEL_DIR/room-layer-dev.meta.js"
      - name: Commit development channel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_DIR" "$CHANNEL_DIR"
          git diff --cached --quiet && exit 0
          git commit -m "Publish Room Layer $VERSION development channel [skip ci]"
          git push origin product-install-poc
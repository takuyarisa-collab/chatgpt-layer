name: Rebuild product install PoC

on:
  push:
    branches:
      - product-install-poc
    paths:
      - product-install-poc/scripts/rebuild-direct-release.mjs
      - product-install-poc/releases/0.2.1-dev2/payload-*.js
      - .github/workflows/rebuild-product-install-poc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-install-poc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild direct userscript
        run: node product-install-poc/scripts/rebuild-direct-release.mjs
      - name: Verify syntax
        run: node --check product-install-poc/releases/0.2.1-dev2/chatgpt-layer-product-0.2.1-dev2.user.js
      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-install-poc/releases/0.2.1-dev2/chatgpt-layer-product-0.2.1-dev2.user.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate direct Gear-compatible 0.2.1-dev2 release [skip ci]"
          git push origin product-install-poc

name: Publish Room Layer install test

on:
  push:
    branches:
      - product-install-poc
    paths:
      - .github/workflows/rebuild-product-install-poc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6eb0-8209-9be2-080d1f9e6118/raw?se=2026-08-06T01:15:25Z&sp=r&sv=2026-02-06&sr=b&scid=d98ad8ba-7196-5f10-a0cf-658d6836d77b&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T22:55:15Z&ske=2026-08-06T22:55:15Z&sks=b&skv=2026-02-06&sig=OhPKGqzxoyH/PWF/9R8Hg7JskbaZYsnsu3dWfIp2txc%3D"
      EXPECTED_SHA256: "43470acd7871c5c3b065da784144e90776b18d5ff3da315110639f404090fbf1"
      OUTPUT_DIR: "product-install-poc/releases/0.3.0-dev2"
      OUTPUT_FILE: "product-install-poc/releases/0.3.0-dev2/room-layer-0.3.0-dev2.user.js"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-install-poc
      - name: Download verified CI artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/room-layer.zip
          rm -rf /tmp/room-layer-artifact
          mkdir -p /tmp/room-layer-artifact "$OUTPUT_DIR"
          unzip -o /tmp/room-layer.zip -d /tmp/room-layer-artifact
          cp /tmp/room-layer-artifact/room-layer.dev.user.js "$OUTPUT_FILE"
      - name: Verify exact userscript
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $OUTPUT_FILE" | sha256sum --check --strict
          node --check "$OUTPUT_FILE"
          grep -Fq '// @name         Room Layer Dev' "$OUTPUT_FILE"
          grep -Fq '// @version      0.3.0-dev2' "$OUTPUT_FILE"
          if grep -Fq '@require' "$OUTPUT_FILE"; then
            echo 'Unexpected runtime dependency in standalone userscript.' >&2
            exit 1
          fi
      - name: Commit standalone userscript
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_FILE"
          git diff --cached --quiet && exit 0
          git commit -m "Publish standalone Room Layer 0.3.0-dev2 [skip ci]"
          git push origin product-install-poc

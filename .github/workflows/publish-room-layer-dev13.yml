name: Publish Room Layer dev13

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/dev13-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout distribution branch
        uses: actions/checkout@v4
        with:
          ref: product-install-poc
          path: dist

      - name: Verify and publish dev13
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode control/.github/dev13-publish/user.patch.b64 > /tmp/user.patch
          base64 --decode control/.github/dev13-publish/meta.patch.b64 > /tmp/meta.patch

          USER_FILE="dist/product-install-poc/channels/dev/room-layer-dev.user.js"
          META_FILE="dist/product-install-poc/channels/dev/room-layer-dev.meta.js"

          echo "3b02a38468041f77ed705fc97a98515fb155b15d9286f08c2276a7db01233dfb  ${USER_FILE}" | sha256sum -c -
          echo "be11bfe6a303c6d9d1d65c98deff0dc6a3efb1aa6e8212b95276b99e45996018  ${META_FILE}" | sha256sum -c -

          patch -d dist -p0 < /tmp/user.patch
          patch -d dist -p0 < /tmp/meta.patch

          echo "e5563f5ea70a928d62a40da6ffce3dc34dc79a863932cd0c2593474d787945fb  ${USER_FILE}" | sha256sum -c -
          echo "17deff28603d776675ea4d061b4cce63f03e5919d68fc79021564c3af4db85ee  ${META_FILE}" | sha256sum -c -

          mkdir -p dist/product-install-poc/releases/0.3.0-dev13
          cp "${USER_FILE}" dist/product-install-poc/releases/0.3.0-dev13/room-layer-0.3.0-dev13.user.js

          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add \
            product-install-poc/channels/dev/room-layer-dev.user.js \
            product-install-poc/channels/dev/room-layer-dev.meta.js \
            product-install-poc/releases/0.3.0-dev13/room-layer-0.3.0-dev13.user.js
          git -C dist commit -m "Publish Room Layer dev13"
          git -C dist push origin HEAD:product-install-poc
